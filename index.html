<title>Arrakis for Idiots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2E9DA; --surface:#FBF6EC; --surface2:#EADFCB; --ink:#2B2016; --muted:#76624D; --line:#D8C8AC;
  --spice:#B9501A; --spice-soft:#F3D9C4; --on-spice:#FFF8F0; --ibad:#2C62A0; --good:#3B7A4B; --warn:#99630F;
  --t0:#8B8579; --t1:#B06A36; --t2:#6F757D; --t3:#4F6F88; --t4:#8FA0AC; --t5:#7E6FA8; --t6:#2F8F80; --tn:#B7A68C;
  --display:"Syncopate","Eurostile","Arial Black",sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15110D; --surface:#1F1914; --surface2:#2A221A; --ink:#EEE2CC; --muted:#A8927A; --line:#3B3025;
    --spice:#E8823B; --spice-soft:#3A2517; --on-spice:#1A0F07; --ibad:#80B2E8; --good:#7FC08E; --warn:#E3AB4E;
    --t0:#9C968A; --t1:#D08650; --t2:#9AA1A9; --t3:#7FA3C0; --t4:#B9C6D0; --t5:#A898D6; --t6:#4FC2AF; --tn:#6F604E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15110D; --surface:#1F1914; --surface2:#2A221A; --ink:#EEE2CC; --muted:#A8927A; --line:#3B3025;
  --spice:#E8823B; --spice-soft:#3A2517; --on-spice:#1A0F07; --ibad:#80B2E8; --good:#7FC08E; --warn:#E3AB4E;
  --t0:#9C968A; --t1:#D08650; --t2:#9AA1A9; --t3:#7FA3C0; --t4:#B9C6D0; --t5:#A898D6; --t6:#4FC2AF; --tn:#6F604E;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--ibad);outline-offset:2px}
a{color:var(--ibad)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100%;max-width:1280px;margin:0 auto;padding-inline:16px}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px 0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font:700 19px/1 var(--display);letter-spacing:.14em;margin:0;text-transform:uppercase}
.brand .ver{font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.horizon{height:2px;margin-top:12px;background:linear-gradient(90deg,var(--spice) 0 28%,var(--line) 28% 100%)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:var(--r);font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.tabs button:hover{color:var(--ink);background:var(--surface2)}
nav.tabs button[aria-selected="true"]{color:var(--on-spice);background:var(--spice)}
nav.tabs .badge{display:inline-block;min-width:18px;margin-left:6px;padding:2px 5px;border-radius:9px;background:var(--surface2);color:var(--ink);font:500 11px/1 var(--mono);letter-spacing:0}
nav.tabs button[aria-selected="true"] .badge{background:var(--on-spice);color:var(--spice)}
main{flex:1;min-height:0;padding-block:16px}
.view{height:100%}

/* ---------- browse layout ---------- */
.browse{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;height:100%;min-height:0}
.pane{min-height:0;display:flex;flex-direction:column}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 10px}
.search input{flex:1;min-width:0;border:0;background:none;padding:10px 0;font:15px var(--sans);color:var(--ink);outline:none}
.search svg{flex:none;color:var(--muted)}
.search button{border:0;background:none;color:var(--muted);padding:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font:500 12.5px/1.2 var(--sans);color:var(--ink)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.count{font:500 11px/1 var(--mono);color:var(--muted);margin:12px 2px 6px;letter-spacing:.04em;text-transform:uppercase}
.list{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 8px 9px 0}
.row:hover{background:var(--surface2)}
.row[aria-current="true"]{background:var(--spice-soft)}
.row .bar{align-self:stretch;border-radius:2px}
.row .nm{font-weight:500;line-height:1.3}
.row .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.row .tg{font:500 11px/1 var(--mono);color:var(--muted);white-space:nowrap}
.empty{padding:24px 8px;color:var(--muted)}

/* ---------- detail ---------- */
.detail{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 28px}
.back{display:none;border:0;background:none;color:var(--ibad);padding:0 0 10px;font-weight:600}
.eyebrow{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.detail h2{font:700 22px/1.2 var(--display);letter-spacing:.04em;margin:8px 0 10px;text-wrap:balance;text-transform:uppercase}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13.5px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.tier{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 6px;border-radius:4px;font:600 12px/1.2 var(--mono);color:var(--ink);background:var(--surface2)}
.tier i{width:10px;height:10px;border-radius:2px;display:block}
.flag{display:inline-block;padding:2px 7px;border-radius:4px;font:600 11px/1.4 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor}
section.blk{margin-top:22px}
section.blk>h3{font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:10px}
section.blk>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px;padding:12px;background:var(--surface2);border-radius:var(--r)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stepper button{border:0;background:none;width:34px;height:34px;font-size:18px;line-height:1}
.stepper button:hover{background:var(--surface2)}
.stepper input{width:54px;text-align:center;border:0;border-inline:1px solid var(--line);background:none;height:34px;font:500 15px var(--mono);color:var(--ink)}
.stepper.sm button{width:28px;height:28px;font-size:15px}
.stepper.sm input{width:46px;height:28px;font-size:13px}
.btn{border:1px solid var(--spice);background:var(--spice);color:var(--on-spice);border-radius:var(--r);padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--spice)}
.btn.small{padding:5px 10px;font-size:13px}
.note-ok{font-size:13px;color:var(--good);font-weight:600}
.routes{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ing{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline}
.ing .q{font:500 14px var(--mono);text-align:right;color:var(--ink);min-width:3.5em}
.ing .lnk{background:none;border:0;padding:0;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ing .lnk:hover{text-decoration-color:var(--spice);color:var(--spice)}
.ing .k{font-size:12px;color:var(--muted);text-align:right}
.ing>div{display:contents}
.ing .line{grid-column:1/-1;height:1px;background:var(--line);opacity:.6}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tile{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 11px;background:var(--surface2);border-radius:var(--r);border:0;text-align:left;width:100%}
.tile:hover{outline:1px solid var(--muted)}
.tile .nm{font-size:13.5px;line-height:1.3}
.tile .nm small{display:block;color:var(--muted);font-size:11.5px}
.tile .q{font:500 14px var(--mono);white-space:nowrap}

/* ---------- shared list pieces ---------- */
const COLORS = ["#C2571F", "#2C6FB0", "#3C8A55", "#8A4FB0", "#B0852C", "#1F8A86", "#B03C6A", "#5F6B78"];
const colorFor = uid => { let h = 0; for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const initials = n => (n || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const dot = (uid, name) => `<span class="dot" style="background:${colorFor(uid)}" aria-hidden="true">${esc(initials(name))}</span>`;
const nameOf = uid => (G.members[uid] && G.members[uid].name) || "Someone";
const stationShort = s => s.replace(/\s*\(.*\)/, "");

function runHTML(crafts, lede) {
  if (!crafts.length) return "";
  const byStation = {};
  crafts.slice().reverse().forEach(c => { const st = stationShort(c.station); (byStation[st] = byStation[st] || []).push(c); });
  return `<div class="card"><h2>Crafting run</h2><p class="lede">${lede}</p>
    ${Object.entries(byStation).map(([st, cs]) => `<div class="grp">${esc(st)}</div><ol class="steps">${cs.map(c => `<li><span class="q">${fmtN(c.times)}×</span><button class="lnk" style="background:none;border:0;padding:0;text-align:left;color:inherit" data-go="${esc(c.n)}">${esc(c.n)}</button><span class="st num">${c.make !== c.times ? "→ " + fmtQplain(c.n, c.make) : ""}</span></li>`).join("")}</ol>`).join("")}
  </div>`;
}
function checklistHTML(rows, isGot, whoGot, prefix, attr) {
  return BUCKETS.map(b => {
    const rs = rows.filter(([n]) => (RAWS.get(n)?.b || "Other") === b);
    if (!rs.length) return "";
    return `<div class="grp">${esc(b)}</div>` + rs.map(([n, q]) => {
      const r = RAWS.get(n), got = isGot(n), id = prefix + n.replace(/\W+/g, "_"), who = got && whoGot ? whoGot(n) : "";
      return `<label class="check ${got ? "done" : ""}" for="${id}">
        <input type="checkbox" id="${id}" ${attr}="${esc(n)}" ${got ? "checked" : ""}>
        <span class="nm">${esc(n)}${who ? `<span class="tick">✓ ${who}</span>` : `<small>${esc(r?.l || r?.o || "")}</small>`}</span><span class="q">${fmtQplain(n, q)}</span></label>`;
    }).join("");
  }).join("");
}
function entryHTML(n, q, i, extra = "") {
  const it = ITEMS.get(n);
  return `<div class="entry${extra ? " g" : ""}">
    <span class="bar" style="background:${tierColor(it?.t)}"></span>
    <button class="nm" data-go="${esc(n)}">${esc(n)}</button>${extra}
    <span class="stepper sm"><button data-dq="${i}" data-d="-1" aria-label="Fewer ${esc(n)}">−</button><input class="num" data-qi="${i}" value="${q}" inputmode="numeric" aria-label="Quantity of ${esc(n)}"><button data-dq="${i}" data-d="1" aria-label="More ${esc(n)}">+</button></span>
    <button class="x" data-rm="${i}" aria-label="Remove ${esc(n)}">×</button></div>`;
}
/* two-tap confirm, since the page can't use confirm() dialogs */
function armConfirm(btn, label, fn) {
  if (!btn) return;
  const orig = btn.textContent;
  btn.onclick = () => {
    if (btn.dataset.armed) { fn(); return; }
    btn.dataset.armed = "1"; btn.textContent = label;
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = orig; } }, 4000);
  };
}

/* ---------- my list ---------- */
.mylist{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;align-items:start;height:100%;overflow:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}

/* ---------- survive ---------- */
.survive{height:100%;overflow:auto}

.stage{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line)}

.tips{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted);max-width:75ch}

ontainers","l":"Faction strongholds","t":null},{"n":"Spice-Infused Steel Dust","b":"Looted Parts","o":"Loot from secure containers","l":"Faction strongholds","t":null},{"n":"Spice-infused Aluminum Dust","b":"Looted Parts","o":"Ultra Rare Containers, e.g. Forgotten Testing Station (Hagga Basin), 5-17/container","l":"","t":4},{"n":"Spice-infused Copper Dust","b":"Looted Parts","o":"Loot from secure containers of powerful factions","l":"Faction strongholds","t":null},{"n":"Spice-infused Duraluminum Dust","b":"Looted Parts","o":"Loot from secure containers","l":"Faction strongholds","t":null},{"n":"Spice-infused Iron Dust","b":"Looted Parts","o":"Ultra Rare Containers","l":"","t":2},{"n":"Spice-infused Plastanium Dust","b":"Looted Parts","o":"Loot from secure containers","l":"Faction strongholds / Deep Desert","t":null},{"n":"Spice-infused Steel Dust","b":"Looted Parts","o":"Ultra Rare Containers","l":"","t":3},{"n":"Stillsuit Tubing","b":"Looted Parts","o":"Loot (Fremen / Maas Kharet)","l":"Fremen & Maas Kharet sites","t":null},{"n":"Stravidium Mass","b":"Stone & Minerals","o":"Mining with Cutteray (Mk5+)","l":"Deep Desert","t":6},{"n":"Thermoelectric Cooler","b":"Looted Parts","o":"Looted (Deep Desert shield wall)","l":"","t":null},{"n":"Titanium Ore","b":"Ore","o":"Mining with Cutteray (Mk5+)","l":"Deep Desert","t":6},{"n":"Water","b":"Water","o":"Windtrap, Deathstill (corpse -> ~25,000 mL/hr, 200 power), Dew Reaper, Blood Extractor, wells/cisterns","l":"Everywhere (base-produced)","t":null}],"guide":{"survival":[{"topic":"Water","icon":"water","tips":["Keep hydration high: a full water bar grants bonus stamina, while running dry drains health. Carry at least a few Blood Sacks or a filled Literjon at all times.","Wear your stillsuit (the chest piece matters most); it recycles moisture into a catchpocket you can sip from, and each tier (Scavenger, Kirab, Slaver, Native, Mercenary, CHOAM) retains more.","Early water comes from blood: equip the Basic Exsanguination Kit (later Blood Extractor Mk2+) to drain defeated enemies, then process the blood into water in a Blood Purifier at base.","Use a Dew Reaper on dew-covered plants; patches hold far more water at dusk, night and the blue dawn phase than under midday sun.","You can drink directly from Water Cisterns, Windtraps, and base water, and settlement barkeeps sell cheap shots of water in a pinch.","From the Steel tier, a Windtrap produces water passively (needs power and filters, must stand unsheltered), and the Fremen Deathstill renders corpses into large amounts of water.","Base water is a single shared pool stored in Water Cisterns; refineries pull from it, so build extra cisterns before you scale up refining."]},{"topic":"Heat & sun exposure","icon":"sun","tips":["Standing in direct sun fills a Sunstroke meter; when it maxes out, water loss spikes and then you start taking damage.","Duck into shade (rock overhangs, buildings, caves) to let the meter drain before it fills; plan open-ground runs so you can hop between shadows.","Night and early morning are the safest times for long walks and dew harvesting; hotter zones (heat level 2-3) punish you fast without proper gear."]},{"topic":"Sandworms","icon":"worm","tips":["On open sand a vibration/threat indicator appears; the higher it climbs, the sooner a worm arrives. Rock is always safe ground.","Wormsign: rippling sand, dust plumes, rumbling audio, and desert mice (muad'dib) diving into the sand. Once the breach starts, stop being stealthy and sprint or drive straight to rock.","Sprinting, vehicles, shields and suspensor/levitation devices all create extra vibration; walking or crouching lowers it. Avoid reddish drumsand, which is very loud.","Vehicles are not faster than a worm, so route rock-to-rock rather than across long dune seas, and never leave a bike parked on open sand.","Being eaten is the worst death: everything you carry is lost. The first time you are eaten on a Sandbike you get a one-time vehicle save via the Vehicle Backup Tool."]},{"topic":"Sandstorms & Coriolis storms","icon":"storm","tips":["Regular sandstorms show on the map with direction and about a two-minute warning; get to a 'Sheltered' spot (cave, building, under a rock shelf) before it hits.","Storms damage unsheltered players and exposed vehicles, and they erase your probe/scan coverage, so re-scan afterward.","Park vehicles under cover or inside a building when a storm approaches.","The Coriolis storm is the Deep Desert's big weekly event; on official multiplayer servers it still resets the Deep Desert map. In 1.5 it no longer instantly kills, and private/self-hosted servers can configure or disable Coriolis auto-spawn."]},{"topic":"Spice","icon":"spice","tips":["Spice Sand appears as orange spice fields and short-lived spice blows on open sand (worm territory); harvest by hand, with a Static Compactor, or with a Sandcrawler.","Refine Spice Sand plus a lot of water into Spice Melange at a Spice Refinery (Medium and Large Spice Refinery are far more efficient). Melange is not dropped on death.","Consuming spice gives buffs but raises blood toxicity; the higher it goes, the more spice you need and the harsher the withdrawal (stamina/health debuffs). Check your level with the character screen and wait it out safely at base.","Harvesting noise draws worms, so harvest in short bursts and keep an escape route to rock."]},{"topic":"Death & recovery","icon":"skull","tips":["Before dying you are knocked down and can self-revive; if you do die, resources drop in a lootable pack at your death spot while your equipped gear stays on you with a small durability hit (cut from 5% to 2% in 1.5).","Deaths to sandworms (and, historically, the Coriolis storm) delete everything you were carrying, so bank valuables before crossing sand.","Craft and place a Respawn Beacon (20 Salvaged Metal) near where you are working; only one is active at a time and it is kept on death. You can also respawn at your base or at social hubs.","Drop off resources at base often; on multiplayer servers anything left on the ground can be taken by others."]},{"topic":"Base safety","icon":"shield","tips":["Place a Sub-Fief Console with the Construction Tool to claim land; Advanced Sub-Fief Consoles can be expanded with Staking Units. Build on rock, never on open sand.","Taxes were removed in 1.5, but bases still need power: keep Fuel-Powered Generators fueled (later Wind Turbine Directional/Omnidirectional or Spice-Powered Generator). An unpowered base loses its shield and starts to decay.","Start small (a walled 4x4 box with generator, Blood Purifier, refinery, fabricator, storage) and expand once power and water are stable.","Outside the Deep Desert you can now dismantle a base for a full material refund, and a Base/Vehicle backup lets you recover builds; use a Solido Replicator to save base blueprints.","Private server owners can tune base decay, building limits and land-claim counts in the server settings (UserServerCustomSettings.ini)."]},{"topic":"Deep Desert basics","icon":"desert","tips":["The Deep Desert is the late-game zone past the Shield Wall, holding Titanium Ore, Stravidium Mass and the richest spice fields.","Each server has a PvE Deep Desert instance and a PvP one; PvP zones give about 2.5x mining and spice yield. Hagga Basin is fully PvE in 1.5.","On multiplayer servers the Coriolis storm resets the Deep Desert weekly (around Monday/Tuesday): bases, terrain and POIs there are wiped, so haul loot home before it. Hagga Basin bases are untouched.","Construction in the Deep Desert costs half; bring Silicone Blocks, Duraluminum Ingots, Spice Melange and fuel to set up a forward base fast."]}],"progression":[{"stage":1,"title":"Crash site & first tools","tier":"Tier 0 (Salvage)","summary":"Survive the tutorial in southern Hagga Basin, learn the Sunstroke and water meters, and craft basic survival gear with the Personal Fabricator.","craft":["Makeshift Clothing","Basic Exsanguination Kit","Scrap Metal Knife","Maula Pistol Kit","Healkit","Respawn Beacon"],"build":["Personal Fabricator (starting device)"],"gather":["Salvaged Metal \u2014 wrecks and scrap piles in southern Hagga Basin","Plant Fiber \u2014 shrubs around the starting area","Blood \u2014 defeated enemies (Basic Exsanguination Kit)","Water \u2014 dew plants at night"],"tips":["Follow the main journey; it hands out key gear, intel and XP.","Hop between shade patches instead of crossing open ground at midday.","Head to Griffin's Reach Tradepost early to pick up contracts and vendors."]},{"stage":2,"title":"First base","tier":"Tier 0-1","summary":"Claim a patch of rock, get power and blood-to-water processing running, and start smelting your first ingots.","craft":["Construction Tool","Cutteray Mk1","Power Pack Mk1"],"build":["Sub-Fief Console","Fuel-Powered Generator","Blood Purifier","Small Ore Refinery","Water Cistern","Chest","Recycler"],"gather":["Copper Ore \u2014 rock deposits in southern Hagga Basin","Granite Stone \u2014 rocks everywhere","Salvaged Metal \u2014 wrecks","Blood Sacks \u2014 enemies at nearby camps"],"tips":["Build on rock near a tradepost, never on open sand.","A walled 4x4 box is enough at first; don't over-build.","Keep generator fuel stocked or the shield drops and the base decays."]},{"stage":3,"title":"Copper tier & first Sandbike","tier":"Tier 1 (Copper)","summary":"Refine Copper Ingots, get your first stillsuit and Literjon, and finish the Scrap Mettle contracts to build a Sandbike.","craft":["Scavenger Stillsuit","Literjon","Dew Reaper","Copper Ingot","Sandbike (Chassis Mk1, Hull Mk1, Engine Mk1 or Mohandis Engine Mk1, PSU Mk1, 3x Tread Mk1)","Binoculars"],"build":["Water Cistern","Blood Purifier (a second one)","Medium Storage Container"],"gather":["Copper Ore \u2014 southern Hagga Basin rocks","EMF Generators \u2014 salvage from wrecks and camps","Fuel Cells / fuel \u2014 wrecks and camps for Sandbike and generator"],"tips":["Scrap Mettle (Griffin's Reach contract board) pays well and walks you through the Sandbike; 'Fremen Finds' was removed from the chain in 1.5.","Pick up the hookshot as early as possible.","Always park the bike on rock."]},{"stage":4,"title":"Iron tier","tier":"Tier 2 (Iron)","summary":"Move north toward the Vermilius Gap, mine iron, and start making Silicone Blocks, which almost every later recipe needs.","craft":["Cutteray Mk2","Kirab Stillsuit","Dew Reaper Mk2","Blood Extractor Mk2","Holtzman Shield Mk2","Medium Blood Sack","Iron Ingot","Silicone Block"],"build":["Improved Blood Purifier","Small Chemical Refinery","Vehicle Fabricator","extra Small Ore Refineries"],"gather":["Iron Ore \u2014 orange/red rock areas around the Vermilius Gap and central Hagga Basin","Flour Sand \u2014 pale sand flats (Static Compactor or by hand)","Complex Machinery \u2014 salvage at the Iron Works POIs"],"tips":["Cutteray Mk2 is the key upgrade; it's needed for Carbon and Erythrite later.","Flour Sand is on open sand, so watch the worm meter.","Upgrade Sandbike parts to Mk2 as soon as possible."]},{"stage":5,"title":"Steel tier & Buggy","tier":"Tier 3 (Steel)","summary":"Make Steel from Carbon plus Iron, unlock automatic water, and build a Buggy to haul heavy ore.","craft":["Steel Ingot","Cobalt Paste","Slaver Stillsuit","Buggy (Mk3 parts)","Static Compactor"],"build":["Windtrap","Fremen Deathstill","Medium Water Cistern","Medium Ore Refinery","Medium Chemical Refinery"],"gather":["Carbon Ore \u2014 white chunks in rocks near drumsand in Jabal Eifrit (north of the Anvil) and Hagga Rift hills; Cutteray Mk2+","Erythrite Crystal \u2014 pink crystals in the Hagga Rift tunnel (east entrance near Vermilius Gap)","Calibrated Servok \u2014 barracks POIs"],"tips":["Erythrite is heavy, so bring a vehicle.","Windtraps need filters and power; build several.","Medium refineries use less ore per ingot, so switch as soon as you can."]},{"stage":6,"title":"Aluminum tier & Scout Ornithopter","tier":"Tier 4 (Aluminum)","summary":"Mine Aluminum near the const USED = new Map();
for (const it of DATA.items) it.routes.forEach((rt, ri) => {

    if (!arr.some(u => u.n === it.n)) arr.push({ n: it.n, q, alt: ri > 0 });

});
const GROUPS = ["Materials","Weapons","Tools","Armor","Stillsuits","Consumables","Vehicles","Vehicle Parts","Base"];

/* ---------- rollup: demand aggregated in dependency order ---------- */
function routeOf(name) { const it = ITEMS.get(name); return it ? it.routes[Math.min(S.route[name] || 0, it.routes.length - 1)] : null; }
function rollup(roots) {
  const order = [], seen = new Set(), stack = new Set();
  const visit = n => {
    if (seen.has(n) || !ITEMS.has(n)) return;
    if (stack.has(n)) return;
    stack.add(n);
    for (const [c] of routeOf(n).in) visit(c);
    stack.delete(n); seen.add(n); order.push(n);
  };
  roots.forEach(([n]) => visit(n));
  order.reverse();
  const need = new Map();
  roots.forEach(([n, q]) => need.set(n, (need.get(n) || 0) + q));
  const raw = new Map(), crafts = [];
  for (const n of order) {
    const d = need.get(n) || 0; if (!d) continue;
    const rt = routeOf(n), times = Math.ceil(d / rt.out);
    crafts.push({ n, times, make: times * rt.out, station: rt.station });
    for (const [c, q] of rt.in) need.set(c, (need.get(c) || 0) + q * times);
  }
  for (const [n, q] of need) if (!ITEMS.has(n)) raw.set(n, q);
  return { raw, crafts };
}
const rawSorted = raw => [...raw].sort((a, b) => {
  const ba = BUCKETS.indexOf(RAWS.get(a[0])?.b), bb = BUCKETS.indexOf(RAWS.get(b[0])?.b);
  return ba - bb || b[1] - a[1];
});

const $ = id => document.getElementById(id);
function setTab(t) {

  $("mylist").hidden = t !== "list";

  if (t === "craft" || t === "gather") renderBrowse();
  if (t === "list") renderList();

}

/* ---------- browse (craft + gather) ---------- */
function chip(label, pressed, attrs = "", sw = "") {
  return `<button class="chip" aria-pressed="${pressed}" ${attrs}>${sw ? `<span class="sw" style="background:${sw}"></span>` : ""}${esc(label)}</button>`;
}
function renderChips() {

    $("tierChips").innerHTML = chip("Any tier", S.tier === "All", `data-t="All"`) +

  } else {

  $("groupChips").querySelectorAll("[data-b]").forEach(b => b.onclick = () => { S.bucket = b.dataset.b; save(); renderBrowse(); });

}
const matches = (name, q) => { const s = name.toLowerCase(); return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => s.includes(w)); };

    let rows = DATA.items.filter(i => (S.group === "All" || i.g === S.group) && (S.tier === "All" || String(i.t) === S.tier) && (!S.q || matches(i.n, S.q)));
    rows.sort((a, b) => GROUPS.indexOf(a.g) - GROUPS.indexOf(b.g) || (a.t ?? -1) - (b.t ?? -1) || a.n.localeCompare(b.n));

function select(name) {
  if (ITEMS.has(name)) { S.sel = name; S.mult = 1; if (S.tab !== "craft") { S.tab = "craft"; } }
  else if (RAWS.has(name)) { S.gsel = name; if (S.tab !== "gather") { S.tab = "gather"; } }
  else return;
  save();
  $("browse").classList.add("show-detail");
  setTab(S.tab);
  $("detail").scrollTop = 0;
  if (window.innerWidth <= 760) window.scrollTo(0, 0);
}
function go(name) {
  const clean = name.replace(/\s*\(.*$/, "").trim();
  if (ITEMS.has(name) || RAWS.has(name)) return select(name);
  if (ITEMS.has(clean) || RAWS.has(clean)) return select(clean);
  S.q = clean; S.group = "All"; S.tier = "All"; S.bucket = "All"; save();
  $("browse").classList.remove("show-detail");
  setTab(DATA.items.some(i => matches(i.n, clean)) || !DATA.raws.some(r => matches(r.n, clean)) ? "craft" : "gather");
}

const backBtn = `<button class="back" data-back>‹ Back to list</button>`;
function wireDetail(root) {

function usedInHTML(name) {

  return `<div class="usedin">` + GROUPS.filter(g => by[g]).map(g =>
    `<h4>${esc(g)} · ${by[g].length}</h4>` + by[g].sort((a, b) => b.q - a.q).map(x =>
      `<button data-go="${esc(x.n)}"><span>${esc(x.n)}${x.alt ? " <small>(alt)</small>" : ""}</span><span class="q">${fmtQ(name, x.q)}</span></button>`).join("")).join("") + `</div>`;

}
function tierHTML(it) {

function renderItem(name) {

const COLORS = ["#C2571F", "#2C6FB0", "#3C8A55", "#8A4FB0", "#B0852C", "#1F8A86", "#B03C6A", "#5F6B78"];
const colorFor = uid => { let h = 0; for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const initials = n => (n || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const dot = (uid, name) => `<span class="dot" style="background:${colorFor(uid)}" aria-hidden="true">${esc(initials(name))}</span>`;
const nameOf = uid => (G.members[uid] && G.members[uid].name) || "Someone";
const stationShort = s => s.replace(/\s*\(.*\)/, "");

function runHTML(crafts, lede) {
  if (!crafts.length) return "";
  const byStation = {};
  crafts.slice().reverse().forEach(c => { const st = stationShort(c.station); (byStation[st] = byStation[st] || []).push(c); });
  return `<div class="card"><h2>Crafting run</h2><p class="lede">${lede}</p>
    ${Object.entries(byStation).map(([st, cs]) => `<div class="grp">${esc(st)}</div><ol class="steps">${cs.map(c => `<li><span class="q">${fmtN(c.times)}×</span><button class="lnk" style="background:none;border:0;padding:0;text-align:left;color:inherit" data-go="${esc(c.n)}">${esc(c.n)}</button><span class="st num">${c.make !== c.times ? "→ " + fmtQplain(c.n, c.make) : ""}</span></li>`).join("")}</ol>`).join("")}
  </div>`;
}
function checklistHTML(rows, isGot, whoGot, prefix, attr) {
  return BUCKETS.map(b => {
    const rs = rows.filter(([n]) => (RAWS.get(n)?.b || "Other") === b);
    if (!rs.length) return "";
    return `<div class="grp">${esc(b)}</div>` + rs.map(([n, q]) => {
      const r = RAWS.get(n), got = isGot(n), id = prefix + n.replace(/\W+/g, "_"), who = got && whoGot ? whoGot(n) : "";
      return `<label class="check ${got ? "done" : ""}" for="${id}">
        <input type="checkbox" id="${id}" ${attr}="${esc(n)}" ${got ? "checked" : ""}>
        <span class="nm">${esc(n)}${who ? `<span class="tick">✓ ${who}</span>` : `<small>${esc(r?.l || r?.o || "")}</small>`}</span><span class="q">${fmtQplain(n, q)}</span></label>`;
    }).join("");
  }).join("");
}
function entryHTML(n, q, i, extra = "") {
  const it = ITEMS.get(n);
  return `<div class="entry${extra ? " g" : ""}">
    <span class="bar" style="background:${tierColor(it?.t)}"></span>
    <button class="nm" data-go="${esc(n)}">${esc(n)}</button>${extra}
    <span class="stepper sm"><button data-dq="${i}" data-d="-1" aria-label="Fewer ${esc(n)}">−</button><input class="num" data-qi="${i}" value="${q}" inputmode="numeric" aria-label="Quantity of ${esc(n)}"><button data-dq="${i}" data-d="1" aria-label="More ${esc(n)}">+</button></span>
    <button class="x" data-rm="${i}" aria-label="Remove ${esc(n)}">×</button></div>`;
}
/* two-tap confirm, since the page can't use confirm() dialogs */
function armConfirm(btn, label, fn) {
  if (!btn) return;
  const orig = btn.textContent;
  btn.onclick = () => {
    if (btn.dataset.armed) { fn(); return; }
    btn.dataset.armed = "1"; btn.textContent = label;
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = orig; } }, 4000);
  };
}

/* ---------- group sync (Firebase) ---------- */
const G = { state: "solo", uid: null, me: null, members: {}, items: [], got: {}, players: {} };
let fb = null, unsubs = [];
const gotId = n => "m_" + n.replace(/[^A-Za-z0-9]+/g, "_").slice(0, 120);
const errText = e => (e && e.code === "permission-denied") ? "The group didn't accept that. You may have been removed; try rejoining." : "Couldn't reach the group. Check your connection and try again.";

function setStatus(state) {
  G.state = state;
  const el = $("status");
  el.dataset.state = state;
  $("statusText").textContent = { solo: "Solo", join: "Join group", live: G.me ? G.me.name : "Group", offline: "Offline" }[state];
  el.title = { solo: "Group sync isn't set up on this copy", join: "Join your server's group", live: "Connected to the group · tap to change your name", offline: "Can't reach the group right now" }[state];
  updateBadge();
  if (S.tab === "group") renderGroup();
  if (S.tab === "craft" || S.tab === "gather") renderBrowse();
}
const rerender = () => { updateBadge(); if (S.tab === "group") renderGroup(); else if (S.tab === "craft" || S.tab === "gather") renderBrowse(); };

const Group = {
  col: name => fb.board.collection(name),
  async add(n, q) {
    const ex = G.items.find(x => x.n === n);
    if (ex) return Group.col("groupItems").doc(ex.id).update({ q: Math.min(9999, ex.q + q) });
    return Group.col("groupItems").add({ n, q: Math.min(9999, q), by: G.uid, at: firebase.firestore.FieldValue.serverTimestamp() });
  },
  setQty: (id, q) => Group.col("groupItems").doc(id).update({ q }),
  remove: id => Group.col("groupItems").doc(id).delete(),
  tick: (n, on) => on ? Group.col("groupGot").doc(gotId(n)).set({ n, by: G.uid, at: firebase.firestore.FieldValue.serverTimestamp() })
                      : Group.col("groupGot").doc(gotId(n)).delete(),
  async untickAll() { const b = fb.db.batch(); Object.values(G.got).forEach(g => b.delete(Group.col("groupGot").doc(gotId(g.n)))); return b.commit(); },
  async clear() {
    const b = fb.db.batch();
    G.items.forEach(x => b.delete(Group.col("groupItems").doc(x.id)));
    Object.values(G.got).forEach(g => b.delete(Group.col("groupGot").doc(gotId(g.n))));
    return b.commit();
  },
};

let pushT;
function pushMine() {
  if (G.state !== "live" || !G.me) return;
  clearTimeout(pushT);
  pushT = setTimeout(() => {
    fb.board.collection("players").doc(G.uid).set({ list: S.example ? [] : S.list.slice(0, 200), at: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(() => {});
  }, 600);
}

function stopGroup() { unsubs.forEach(u => u()); unsubs = []; }
function startGroup() {
  stopGroup();
  const fail = () => setStatus("offline");
  unsubs.push(fb.board.collection("members").onSnapshot(s => {
    G.members = {}; s.forEach(d => { G.members[d.id] = { name: d.data().name }; }); rerender();
  }, fail));
  unsubs.push(fb.board.collection("groupItems").onSnapshot(s => {
    G.items = []; s.forEach(d => { const x = d.data(); G.items.push({ id: d.id, n: x.n, q: x.q, by: x.by, at: x.at ? x.at.toMillis() : Date.now() }); });
    G.items = G.items.filter(x => ITEMS.has(x.n)).sort((a, b) => a.at - b.at); rerender();
  }, fail));
  unsubs.push(fb.board.collection("groupGot").onSnapshot(s => {
    G.got = {}; s.forEach(d => { const x = d.data(); G.got[x.n] = { n: x.n, by: x.by }; }); rerender();
  }, fail));
  unsubs.push(fb.board.collection("players").onSnapshot(s => {
    G.players = {}; s.forEach(d => { G.players[d.id] = d.data(); }); rerender();
  }, fail));
}

function initGroup() {
  const cfg = CONFIG.FIREBASE;
  if (!cfg.apiKey || !cfg.projectId) return setStatus("solo");
  if (!window.firebase) return setStatus("offline");
  try {
    const app = firebase.initializeApp(cfg);
    fb = { auth: firebase.auth(app), db: firebase.firestore(app) };
    if (CONFIG.EMULATOR) { fb.db.useEmulator(CONFIG.EMULATOR.host, CONFIG.EMULATOR.port); }
    fb.board = fb.db.collection("boards").doc(CONFIG.GROUP_ID || "main");
  } catch (e) { return setStatus("offline"); }
  fb.auth.onAuthStateChanged(user => {
    if (!user) return;
    G.uid = user.uid;
    let first = true;
    fb.board.collection("members").doc(user.uid).onSnapshot(doc => {
      const was = !!G.me;
      G.me = doc.exists ? doc.data() : null;
      if (G.me) {
        setStatus("live");
        if (!was) { startGroup(); pushMine(); }
      } else {
        stopGroup(); G.items = []; G.got = {}; G.members = {}; G.players = {};
        setStatus("join");
        let seen = false; try { seen = localStorage.getItem(KEY + "-joinprompt"); } catch (e) {}
        if (first && !seen) { try { localStorage.setItem(KEY + "-joinprompt", "1"); } catch (e) {} openJoin(); }
      }
      first = false;
    }, () => setStatus("offline"));
  });
  fb.auth.signInAnonymously().catch(() => setStatus("offline"));
}

function openJoin() {
  if (G.state === "solo") { toast("Group sync isn't set up on this copy yet."); return; }
  if (G.state === "offline") { toast("Can't reach the group right now. Check your connection and reload."); return; }
  const d = $("joinDlg"), renaming = !!G.me;
  $("joinTitle").textContent = renaming ? "Change your name" : "Join the group";
  d.querySelector(".lede").textContent = renaming ? "This is how you show up on the group list and ticks." : "Pick the name your friends know you by and enter the group code from whoever runs the server. No account needed.";
  $("joinCode").closest(".fld").hidden = renaming;
  $("joinCode").required = !renaming;
  $("joinGo").textContent = renaming ? "Save" : "Join";
  $("joinName").value = G.me ? G.me.name : (localStorage.getItem(KEY + "-name") || "");
  $("joinErr").hidden = true;
  if (typeof d.showModal === "function") d.showModal(); else d.setAttribute("open", "");
  setTimeout(() => $("joinName").focus(), 30);
}
$("joinCancel").onclick = () => $("joinDlg").close();
$("status").onclick = openJoin;
$("joinForm").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("joinName").value.trim().slice(0, 24), code = $("joinCode").value.trim();
  const err = $("joinErr");
  if (!name) { err.textContent = "Enter a name."; err.hidden = false; return; }
  $("joinGo").disabled = true;
  try {
    const ref = fb.board.collection("members").doc(G.uid);
    if (G.me) await ref.set({ name }, { merge: true });
    else await ref.set({ name, code, joinedAt: firebase.firestore.FieldValue.serverTimestamp() });
    try { localStorage.setItem(KEY + "-name", name); } catch (e2) {}
    $("joinDlg").close();
    toast(G.me && G.me.name !== name ? `You're now ${name}` : `Welcome, ${name}`);
    $("joinCode").value = "";
  } catch (ex) {
    err.textContent = ex && ex.code === "permission-denied" ? "That group code didn't match. Check it with whoever runs the server." : "Couldn't reach the group. Check your connection and try again.";
    err.hidden = false;
  }
  $("joinGo").disabled = false;
});

let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}

    <div class="topics">${G.survival.map(s => `<div class="card"><h3>${esc(s.topic)}</h3><ul>${s.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")}</div>

  V.querySelectorAll("[data-go2]").forEach(b => b.onclick = () => go(b.dataset.go2));
}

/* ---------- boot ---------- */
$("ver").textContent = DATA.version;
updateBadge();
setTab(S.tab);
initGroup();
</script>
